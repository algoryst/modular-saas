volumes:
  apps_local_postgres_data: {}
  apps_local_postgres_data_backups: {}
  apps_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: apps_local_django
    container_name: apps_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: apps_production_postgres
    container_name: apps_local_postgres
    volumes:
      - apps_local_postgres_data:/var/lib/postgresql/18/docker
      - apps_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: apps_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: apps_local_redis
    volumes:
      - apps_local_redis_data:/data

  tailwind:
    <<: *django
    image: apps_local_tailwind
    container_name: apps_local_tailwind
    ports: []
    # Tailwind's watcher exits when stdin closes; a TTY keeps it running.
    tty: true
    command: python manage.py tailwind watch

  celeryworker:
    <<: *django
    image: apps_local_celeryworker
    container_name: apps_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: apps_local_celerybeat
    container_name: apps_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: apps_local_flower
    container_name: apps_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
