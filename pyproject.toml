[project]
name = "apps"
version = "0.1.0"
description = "Modular multi-tenant B2B platform"
readme = "README.md"
license = { text = "Not open source" }
authors = [
  { name = "Nadim Jendoubi", email = "nadeem.jendoubi1996@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.7.0",
  "django==6.0.10",
  "django-allauth[mfa]==65.22.1",
  "django-anymail[brevo]==15.2",
  "django-celery-beat==2.9.0",
  "django-cors-headers==4.9.0",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-ratelimit==4.1.0",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "django-tailwind-cli==4.8.2",
  "djangorestframework==3.18.3",
  "drf-spectacular==0.30.0",
  "flower==2.2.0",
  "gunicorn==27.0.1",
  "hiredis==3.5.0",
  "pillow==13.0.0",
  "psycopg[c]==3.3.9",
  "python-slugify==9.1.3",
  "redis==8.1.0",
  "requests==2.34.2",
  "sentry-sdk==2.75.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "black==26.10.1",
  "coverage==7.17.3",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-upgrade==1.33.0",
  "djangorestframework-stubs==3.18.2",
  "factory-boy==3.3.3",
  "flake8==7.5.0",
  "flake8-bugbear==26.11.16",
  "flake8-print==5.0.0",
  "freezegun==1.5.5",
  "import-linter==2.16",
  "ipdb==0.13.13",
  "isort==9.0.2",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pre-commit==4.7.0",
  "psycopg[c]==3.3.9",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "types-requests==2.33.0.20261030",
  "watchfiles==1.3.0",
  "werkzeug[watchdog]==3.1.9",
]

# ==== black ====
[tool.black]
target-version = [ "py314" ]
extend-exclude = "/migrations/|^/\\.claude/"

# ==== isort ====
[tool.isort]
profile = "black"
known_first_party = [ "apps", "config" ]
skip_glob = [ "*/migrations/*", ".claude/*" ]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== bandit ====
[tool.bandit]
exclude_dirs = [ ".claude", ".venv", "tests" ]

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# CLAUDE.md: mypy strict for services and repositories. `strict = true` is
# global-only (in an override it leaks to every module), so list its flags.
# core (money, events, clock, base models) is the kernel everything else relies on.
module = [ "apps.*.repositories", "apps.*.services", "apps.core.*" ]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# Tests follow the global settings, not the strict kernel rules above.
module = "apps.core.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "apps/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
# The template plugin needs the C tracer; Python 3.14 defaults to sys.monitoring.
run.core = "ctrace"
