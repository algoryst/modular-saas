{% load allauth %}
<section class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-sm">
  <h2 class="mb-3 text-lg font-semibold text-zinc-900">{% slot title %}{% endslot %}</h2>
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <div class="mt-4 flex flex-wrap gap-2">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </div>
  {% endif %}
</section>
