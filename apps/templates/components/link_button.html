{# A link styled as a button. Args: href, label, variant ("primary" default, or "secondary"). #}
<a href="{{ href }}"
   class="inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600/30 {% if variant == 'secondary' %}border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50{% else %}bg-blue-600 text-white hover:bg-blue-700{% endif %}">{{ label }}</a>
